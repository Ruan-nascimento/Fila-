# Configuração do gerador de tipos Go (oapi-codegen). Só modelos nesta etapa;
# os servidores de cada rota serão gerados quando as rotas forem implementadas.
package: contrato
output: types.gen.go
generate:
  models: true
output-options:
  # Gera todos os esquemas, inclusive os usados só pelo SSE (EventEnvelope, StreamSnapshot),
  # que o contrato referencia por extensão (x-event-schema) e não por uma rota.
  skip-prune: true
