  /v1/webhooks/abacatepay:
    post:
      operationId: receiveAbacatePayWebhook
      tags: [provedor]
      summary: Notificação da AbacatePay (webhook v2).
      description: |
        Sem cookies, sem CSRF. Autenticidade conforme a documentação oficial: o secret do webhook em
        `X-Webhook-Secret` (ou na query `webhookSecret`), comparado em tempo constante, prova a origem;
        `X-Webhook-Signature` = base64(HMAC-SHA256(corpo bruto)) com a chave pública da AbacatePay prova
        a integridade. Falhou → 401 e nada é reconhecido; se o aviso cita uma cobrança nossa em aberto,
        a consulta autenticada do worker é antecipada. Autenticado: o aviso é deduplicado pelo `id` e o
        efeito (recebimento, estorno, pendência) é gravado na mesma transação antes do 200. Confere
        ambiente (`devMode`), cobrança, metadados (pedido e loja), método PIX e valor. Os dados do
        pagador não são guardados. 404 quando o webhook está desligado (sem secret configurado).
      security: []
      x-authz: [{ actor: provider, scope: provider_signature }]
      x-transitions: [T-PX-05, T-PX-06, T-RC-02, T-RC-04, T-O-09, T-RF-03, T-RF-04, T-LG-02]
      x-events: [payment.updated, order.updated, financial_issue.updated, pendencies.updated, loyalty.updated]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Envelope da AbacatePay {id, event, apiVersion, devMode, data}; campos novos são tolerados.
      responses:
        '200':
          description: Notificação persistida e aplicada (ou duplicata reconhecida).
          content:
            application/json:
              schema:
                type: object
                required: [received, duplicate]
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        default: { $ref: '#/components/responses/Unexpected' }

