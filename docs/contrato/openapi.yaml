  /v1/desktop/analytics/establishments/{establishmentId}/breakdowns/{dimension}:
    get:
      operationId: getAnalyticsBreakdown
      tags: [analitico]
      summary: Agregado por categoria.
      description: |
        Exclusivo do programa desktop (ADR-0027): exige ao mesmo tempo sessão de dono ocupante da vaga,
        prova DPoP de instalação autorizada e vínculo de dono com a loja. Loja sem vínculo de dono → 404.
        Resposta `Cache-Control: no-store`; agregação no servidor. Dicionário: docs/desktop/metricas.md.
      security: [{ desktopToken: [], desktopProof: [] }]
      x-authz: [{ actor: owner_desktop, scope: establishment }]
