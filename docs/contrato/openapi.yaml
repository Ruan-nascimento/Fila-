  # ---------------------------------------------------------------- eventos
  /v1/stream:
    get:
      operationId: openEventStream
      tags: [eventos]
      summary: Uma conexão SSE por aba. Snapshot inicial, retomada por cursor, heartbeat.
      description: |
        Cada mensagem: `id:` = cursor opaco; `event:` = tipo; `data:` = EventEnvelope (JSON).
        Retomada por cabeçalho Last-Event-ID (reconexão nativa) ou parâmetro `cursor` (não é credencial).
        Cursor válido → reenvia eventos posteriores autorizados; inválido/expirado → `stream.snapshot`.
        Detalhes em docs/contrato/eventos-sse.md.
      security: [{}, { visitorSession: [] }, { accountSession: [] }]
      x-authz:
        - { actor: public, scope: none }
        - { actor: visitor, scope: visit_owner }
        - { actor: customer, scope: self }
        - { actor: professional, scope: own_queue }
        - { actor: owner, scope: establishment }
      parameters:
        - name: establishment_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - name: channels
          in: query
          required: true
          description: Canais desejados; o servidor ignora (e informa no snapshot) canais não autorizados.
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items: { $ref: '#/components/schemas/AudienceKind' }
          style: form
          explode: false
        - name: cursor
          in: query
          required: false
          schema: { $ref: '#/components/schemas/StreamCursor' }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { $ref: '#/components/schemas/StreamCursor' }
      responses:
        '200':
          description: Fluxo text/event-stream. Dados de cada evento seguem EventEnvelope.
          headers:
            Cache-Control:
              schema: { type: string, const: 'no-cache, no-transform' }
            X-Accel-Buffering:
              schema: { type: string, const: 'no' }
          content:
            text/event-stream:
              schema:
                type: string
              x-event-schema: { $ref: '#/components/schemas/EventEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }

  /v1/desktop/installations/activate:
    post:
      operationId: activateDesktopInstallation
      tags: [desktop]
      summary: Ativa um computador com o código de uso único emitido pelo operador (fila-admin).
      description: |
        O componente nativo envia o código e um cabeçalho `DPoP` (RFC 9449, ES256) assinado pela chave
        privada recém-criada da instalação, com a chave pública no cabeçalho `jwk`. O servidor guarda só
        a chave pública e a impressão digital (RFC 7638). Sem sessão nem cookie.
      security: [{ desktopProof: [] }]
      x-authz: [{ actor: desktop_installation, scope: activation_code }]
      x-transitions: [T-DK-02]
      parameters:
        - { $ref: '#/components/parameters/DPoPProof' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 16, maxLength: 24, description: 'Formato XXXX-XXXX-XXXX-XXXX (Crockford).' }
      responses:
        '201':
          description: Instalação autorizada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DesktopInstallation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/desktop/link-tickets:
    post:
      operationId: createDesktopLinkTicket
      tags: [desktop]
      summary: Ticket de 60 s para o Dashboard local usar a MESMA sessão de dono (troca mediada pelo servidor).
      description: |
        Pedido da gestão aberta na janela do programa, com o cookie da sessão de dono ocupante da vaga. O
        ticket não é credencial sozinho: só vira acesso quando trocado com prova de posse da chave de uma
        instalação autorizada da MESMA conta. Nenhum cookie é copiado para JavaScript ou arquivo.
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: owner, scope: owner_session }]
      responses:
        '201':
          description: Ticket emitido (no-store).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DesktopLinkTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/desktop/bindings:
    post:
      operationId: createDesktopBinding
      tags: [desktop]
      summary: Troca o ticket (com prova DPoP) por um token de acesso preso à chave da instalação.
      description: |
        O token (tipo DPoP) vale enquanto a sessão do ticket for a ocupante da vaga de dono, no máximo 2 h.
        Revogar a sessão, trocar de aparelho, sair, remover o vínculo de dono ou revogar a instalação
        invalida as consultas seguintes.
      security: [{ desktopProof: [] }]
      x-authz: [{ actor: desktop_installation, scope: link_ticket }]
      x-transitions: [T-DK-03]
      parameters:
        - { $ref: '#/components/parameters/DPoPProof' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ticket]
              properties:
                ticket: { type: string, minLength: 20, maxLength: 64 }
      responses:
        '201':
          description: Vínculo criado (no-store).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DesktopBinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/desktop/bindings/current/end:
    post:
      operationId: endDesktopBinding
      tags: [desktop]
      summary: Encerra o acesso do Dashboard local (a sessão de dono na gestão continua).
      security: [{ desktopToken: [], desktopProof: [] }]
      x-authz: [{ actor: owner_desktop, scope: self }]
      parameters:
        - { $ref: '#/components/parameters/DPoPProof' }
      responses:
        '204': { description: Vínculo encerrado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/desktop/context:
    get:
      operationId: getDesktopContext
      tags: [desktop]
      summary: Conta, instalação e lojas em que a conta é DONA (lojas só de profissional não aparecem).
      security: [{ desktopToken: [], desktopProof: [] }]
      x-authz: [{ actor: owner_desktop, scope: self }]
      parameters:
        - { $ref: '#/components/parameters/DPoPProof' }
      responses:
        '200':
          description: Contexto do Dashboard (no-store).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DesktopContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/desktop/analytics/establishments/{establishmentId}/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analitico]
      summary: Quatro indicadores da primeira dobra (+ comparação e pendências abertas agora).
      description: |
        Exclusivo do programa desktop (ADR-0027): exige ao mesmo tempo sessão de dono ocupante da vaga,
        prova DPoP de instalação autorizada e vínculo de dono com a loja. Loja sem vínculo de dono → 404.
        Resposta `Cache-Control: no-store`; agregação no servidor. Dicionário: docs/desktop/metricas.md.
      security: [{ desktopToken: [], desktopProof: [] }]
      x-authz: [{ actor: owner_desktop, scope: establishment }]
      parameters:
        - { $ref: '#/components/parameters/DPoPProof' }
        - { $ref: '#/components/parameters/EstablishmentId' }
        - { $ref: '#/components/parameters/AnalyticsFrom' }
        - { $ref: '#/components/parameters/AnalyticsTo' }
        - { $ref: '#/components/parameters/AnalyticsCompare' }
        - { $ref: '#/components/parameters/AnalyticsProfessional' }
        - { $ref: '#/components/parameters/AnalyticsService' }
        - { $ref: '#/components/parameters/AnalyticsMethod' }
      responses:
        '200':
          description: Dados agregados com meta (período efetivo, fuso, instante, unidades, ausências).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/AnalyticsSummary' }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/desktop/analytics/establishments/{establishmentId}/series/{metric}:
    get:
      operationId: getAnalyticsSeries
      tags: [analitico]
      summary: Série temporal de uma métrica (cash, ticket, movement, wait, duration, loyalty).
      description: |
        Exclusivo do programa desktop (ADR-0027): exige ao mesmo tempo sessão de dono ocupante da vaga,
        prova DPoP de instalação autorizada e vínculo de dono com a loja. Loja sem vínculo de dono → 404.
        Resposta `Cache-Control: no-store`; agregação no servidor. Dicionário: docs/desktop/metricas.md.
      security: [{ desktopToken: [], desktopProof: [] }]
      x-authz: [{ actor: owner_desktop, scope: establishment }]
