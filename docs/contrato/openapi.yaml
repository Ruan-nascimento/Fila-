        - { $ref: '#/components/parameters/AnalyticsFrom' }
        - { $ref: '#/components/parameters/AnalyticsTo' }
        - { $ref: '#/components/parameters/AnalyticsCompare' }
        - { $ref: '#/components/parameters/AnalyticsProfessional' }
        - { $ref: '#/components/parameters/AnalyticsService' }
        - { $ref: '#/components/parameters/AnalyticsMethod' }
      responses:
        '200':
          description: Dados agregados com meta (período efetivo, fuso, instante, unidades, ausências).
          content:
