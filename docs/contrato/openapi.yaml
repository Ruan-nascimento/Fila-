openapi: 3.1.0
info:
  title: Fila — API do MVP web
  version: 0.1.0
  summary: Contrato único entre backend (Go) e frontend (React/TypeScript).
  description: |
    Contrato da etapa 00. Regras em docs/regras.md, convenções em docs/contrato/convencoes.md,
    eventos em docs/contrato/eventos-sse.md e transições em docs/matriz-transicoes.md.

    Extensões próprias:
    - `x-authz`: lista de pares ator/escopo autorizados. Qualquer combinação fora da lista é negada (negação por padrão).
    - `x-transitions`: transições da matriz (T-…) que a operação pode executar.
    - `x-events`: tipos de evento SSE gravados na outbox quando a operação muda estado.
    - `x-reauth`: exige reautenticação recente (10 minutos).
    - `x-external-pending`: detalhe que depende de documentação/conta do provedor (nenhum pendente desde a etapa 09).

    Regras gerais: valores em centavos inteiros (BRL); datas RFC 3339 em UTC com sufixo Z;
    identificadores opacos; corpo desconhecido é rejeitado (`additionalProperties: false`);
    todo comando mutável fora de /v1/auth, /v1/visitor-sessions e /v1/webhooks exige `Idempotency-Key`.
  license:
    name: Proprietário
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Mesma origem do frontend (proxy reverso). Ver ADR-0006.
tags:
  - name: saude
    description: Liveness e readiness.
  - name: sessao
    description: Conta, login, sessões, senha e convites.
  - name: visitante
    description: Credencial de visitante e código de recuperação.
  - name: publico
    description: Dados públicos da loja, catálogo e filas.
  - name: cliente
    description: Visita atual, perfil e histórico do titular.
  - name: fila
    description: Participação na fila e operação pela equipe.
  - name: comanda
    description: Itens, solicitações, conclusão e interrupção.
  - name: pagamento
    description: Pix, recebimentos, conferência, estornos e pendências financeiras.
  - name: fidelidade
    description: Programa, pontos, prêmios e reservas.
  - name: administracao
    description: Configuração da loja, equipe, catálogo e auditoria.
  - name: exclusao
    description: Exclusão de conta e acompanhamento.
  - name: eventos
    description: Fluxo SSE de atualizações.
  - name: provedor
    description: Notificações do provedor de pagamento.
  - name: desktop
    description: Instalações do programa do dono (ativação, vínculo à sessão de dono, prova DPoP).
  - name: analitico
    description: Dashboard analítico exclusivo do programa desktop do dono.
  - name: midia
    description: Fotos de perfil, foto pública do profissional e logo da loja (ADR-0028).

paths:
  /healthz/live:
    get:
      operationId: getLiveness
      tags: [saude]
      summary: Processo vivo (não consulta dependências).
      security: []
      x-authz: [{ actor: public, scope: none }]
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /healthz/ready:
    get:
      operationId: getReadiness
      tags: [saude]
      summary: Pronto para tráfego (banco acessível e migrações aplicadas).
      security: []
      x-authz: [{ actor: public, scope: none }]
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- sessão e conta
  /v1/session:
    get:
      operationId: getSession
      tags: [sessao]
      summary: Identidades ativas neste navegador e token CSRF.
      description: Nunca falha por falta de sessão; devolve campos nulos. Renova o uso (expiração por inatividade).
      security: [{}, { accountSession: [] }, { visitorSession: [] }]
      x-authz: [{ actor: public, scope: none }]
      responses:
        '200':
          description: Sessão atual.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SessionView' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/register:
    post:
      operationId: registerAccount
      tags: [sessao]
      summary: Cadastro de cliente. Resposta idêntica exista ou não o e-mail.
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-AC-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAccountRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedGeneric' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/email-verification/confirm:
    post:
      operationId: verifyEmail
      tags: [sessao]
      summary: Confirma e-mail com token de uso único.
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-AC-02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204': { description: E-mail verificado; conta ativa. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/email-verification/resend:
    post:
      operationId: resendVerification
      tags: [sessao]
      summary: Reenvia verificação. Resposta genérica.
      security: []
      x-authz: [{ actor: public, scope: none }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedGeneric' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/login:
    post:
      operationId: login
      tags: [sessao]
      summary: Cria sessão de cliente ou de equipe e define cookie HttpOnly.
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-SS-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sessão criada. Cabeçalho Set-Cookie com __Host-fila_session.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SessionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `owner_session_active` (ADR-0027): credenciais válidas, mas a conta tem vínculo de dono e
            outra sessão válida ocupa a vaga de dono. A outra sessão continua; esta tentativa NÃO recebe
            cookie de sessão. `current` segue OwnerSessionConflict (desafio de 2 min, só no corpo). Junto
            vai o cookie HttpOnly `__Host-fila_owner_attempt` (5 min), que prende o desafio a esta tentativa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/owner-session/takeover:
    post:
      operationId: takeoverOwnerSession
      tags: [sessao]
      summary: Continua neste aparelho e encerra a outra sessão de dono (operação atômica).
      description: |
        Valida o desafio (não vencido, não usado, desta tentativa pelo cookie `__Host-fila_owner_attempt`
        e da MESMA geração da vaga que a pessoa viu), revoga a sessão anterior (`owner_session_replaced`),
        cria a nova e só então define o cookie de sessão. Se a vaga mudou enquanto a confirmação estava
        aberta, responde `owner_session_challenge_invalid` sem derrubar ninguém. Repetir a mesma
        confirmação depois de uma queda de rede reentrega o acesso só se esta tentativa venceu e continua
        ocupando a vaga (nunca revoga de novo).
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-SS-07]
      x-events: [stream.session_ended]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerChallengeRequest' }
      responses:
        '200':
          description: Acesso de dono transferido para este aparelho. Set-Cookie com __Host-fila_session.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SessionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/owner-session/cancel:
    post:
      operationId: cancelOwnerTakeover
      tags: [sessao]
      summary: Cancela e mantém a outra sessão (descarta o desafio). Sempre 204.
      security: []
      x-authz: [{ actor: public, scope: none }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerChallengeRequest' }
      responses:
        '204': { description: Desafio descartado (ou já inexistente). A outra sessão continua. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [sessao]
      summary: Revoga a sessão de conta no servidor e apaga o cookie.
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      x-transitions: [T-SS-02]
      x-events: [stream.session_ended]
      responses:
        '204': { description: Sessão revogada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [sessao]
      summary: Solicita link de redefinição (30 min, uso único). Resposta genérica.
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-PW-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedGeneric' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [sessao]
      summary: Define nova senha com token; revoga todas as sessões da conta.
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-PW-02, T-SS-04]
      x-events: [stream.session_ended]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: Senha alterada; sessões revogadas. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/password/change:
    post:
      operationId: changePassword
      tags: [sessao]
      summary: Troca a senha; revoga as demais sessões.
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      x-transitions: [T-SS-03]
      x-events: [stream.session_ended]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Senha alterada. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/reauthenticate:
    post:
      operationId: reauthenticate
      tags: [sessao]
      summary: Confirma identidade recente (válida por 10 min) para ações sensíveis.
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      x-transitions: [T-SS-06]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReauthenticateRequest' }
      responses:
        '200':
          description: Reautenticado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SessionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/reauthenticate/email-code:
    post:
      operationId: requestReauthCode
      tags: [sessao]
      summary: Envia um código de 8 dígitos ao e-mail verificado para reautenticar conta sem senha (só Google).
      description: |
        O código vale 10 minutos, só nesta sessão, e é usado em `reauthenticate` (`email_code`).
        Conta com senha recebe `409 password_available` (use a senha).
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      x-transitions: [T-SS-06]
      responses:
        '202': { $ref: '#/components/responses/AcceptedGeneric' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/google/start:
    post:
      operationId: startGoogleAuth
      tags: [sessao]
      summary: Inicia o login (ou o vínculo) com Google — só jornada de cliente (ADR-0028).
      description: |
        OpenID Connect com Authorization Code e PKCE S256 no backend. Cria uma transação de uso único
        (10 min) presa a este navegador (cookie HttpOnly de correlação), à intenção, ao retorno
        validado (lista fechada de rotas internas) e à loja resolvida. Responde a URL do Google.
        `link` exige sessão de conta com reautenticação recente. Loja inexistente → 404 (não inicia).
        Sessão aberta pelo Google é sempre de cliente: nunca dá acesso à gestão.
      security: [{}, { accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-AC-06]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleStartRequest' }
      responses:
        '200':
          description: URL de autorização do Google.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [authorization_url]
                    properties:
                      authorization_url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/google/callback:
    get:
      operationId: googleAuthCallback
      tags: [sessao]
      summary: Retorno do Google (redirect URI cadastrada). Sempre redireciona para uma rota interna limpa.
      description: |
        Consome a transação (state de uso único, mesmo navegador, dentro do prazo) antes de trocar o
        código; valida assinatura, emissor, audiência, expiração, nonce e azp do id_token. Não guarda
        tokens do Google. Destinos: o retorno validado (sucesso), `/entrar?google=<situação>` ou
        `/conta?google=<situação>` (vínculo). Situações: `cancelado`, `falhou`, `conta_existente`,
        `verificar_email`, `indisponivel`, `conectado`, `ja_vinculado`.
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-AC-05, T-AC-06, T-SS-08]
      parameters:
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 2048 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 100 } }
      responses:
        '303':
          description: Redireciona para a rota interna (com a sessão de cliente, quando liberada).
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/google/unlink:
    post:
      operationId: unlinkGoogle
      tags: [sessao]
      summary: Desconecta o Google da conta (exige reautenticação e outro método de acesso).
      description: Conta só com Google recebe `409 last_access_method` (nunca fica sem acesso).
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      x-transitions: [T-AC-07]
      x-reauth: true
      responses:
        '204': { description: Desconectado (ou já estava). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/invites/accept:
    post:
      operationId: acceptInvite
      tags: [sessao]
      summary: Profissional ativa acesso pelo convite (uso único, 24 h).
      description: |
        Se o e-mail já possui conta ativa, exige `password` dessa conta (senha errada → 401 `invalid_credentials`, com limite de tentativas).
        Caso contrário cria conta já verificada (o convite prova o e-mail); se havia conta pendente de verificação com esse e-mail,
        ela passa a usar a senha informada. Convite usado, revogado, vencido ou inexistente → 409 `invite_invalid` (mesma mensagem).
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-IN-02, T-AC-08]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '204': { description: Vínculo ativo. Fazer login com contexto staff. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/me:
    get:
      operationId: getMyProfile
      tags: [cliente]
      summary: Perfil da própria conta (não depende de loja selecionada). E-mail só leitura.
      security: [{ accountSession: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      responses:
        '200': { $ref: '#/components/responses/MyProfileOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Unexpected' }
    patch:
      operationId: updateMyProfile
      tags: [cliente]
      summary: Altera o nome exibido e/ou a aparência da própria conta.
      description: |
        Só `name`, `appearance` e `expected_version` (opcional; com ele a alteração é condicional e
        versão diferente → `409 version_conflict` com o perfil atual). E-mail, papel, vínculo ou
        verificação no corpo são recusados (campo desconhecido).
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MyProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/me/avatar:
    put:
      operationId: setMyAvatar
      tags: [cliente]
      summary: Associa uma foto pessoal já processada (envio próprio, finalidade avatar).
      description: A foto antiga continua até esta troca confirmar. Versão esperada obrigatória (troca antiga não sobrescreve a nova).
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetAssetRequest' }
      responses:
        '200': { $ref: '#/components/responses/MyProfileOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/me/avatar/remove:
    post:
      operationId: removeMyAvatar
      tags: [cliente]
      summary: Remove a foto pessoal (referência retirada na hora; arquivos apagados após a retenção).
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedRequest' }
      responses:
        '200': { $ref: '#/components/responses/MyProfileOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/me/avatar/{size}:
    get:
      operationId: getMyAvatar
      tags: [midia]
      summary: Foto pessoal da própria conta (privada; autorização refeita a cada pedido, inclusive antes do 304).
      security: [{ accountSession: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      parameters:
        - $ref: '#/components/parameters/ImageSize'
      responses:
        '200': { $ref: '#/components/responses/PrivateImage' }
        '304': { description: Não modificada (depois de autorizar). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/media/uploads:
    post:
      operationId: uploadMedia
      tags: [midia]
      summary: Envia uma imagem (JPEG, PNG ou WebP estático, até 5 MiB, 12 MP, 8.192 px por eixo).
      description: |
        Rota própria (o limite de corpo das demais rotas não muda). O formato real é conferido pela
        assinatura; SVG, GIF, animação, HEIC e desconhecidos são recusados. A imagem é processada
        depois (worker) e o envio NÃO altera o perfil: associe com `setMyAvatar`,
        `setEstablishmentLogo` ou `setMyProfessionalPhoto`. `avatar`: qualquer conta (privado);
        `logo`: dono da loja; `professional_photo`: quem atende na loja (públicas). Limites: 5
        envios/min e 20/dia por conta (configuráveis) e no máximo 10 envios pendentes.
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self },
                { actor: professional, scope: establishment_member }, { actor: owner, scope: establishment }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: purpose, in: query, required: true, schema: { $ref: '#/components/schemas/MediaPurpose' } }
        - { name: establishment_id, in: query, required: false, description: Obrigatório para logo e professional_photo., schema: { $ref: '#/components/schemas/Id' } }
        - { name: crop_x, in: query, required: false, schema: { type: number, minimum: 0, exclusiveMaximum: 1 } }
        - { name: crop_y, in: query, required: false, schema: { type: number, minimum: 0, exclusiveMaximum: 1 } }
        - { name: crop_size, in: query, required: false, description: 'Recorte quadrado normalizado sobre a imagem orientada (x,y relativos a largura/altura; size ao menor lado). Os três juntos ou nenhum.', schema: { type: number, exclusiveMinimum: 0, maximum: 1 } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '202':
          description: Recebida; processamento pendente (a foto antiga continua até associar a nova).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MediaUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/media/uploads/{assetId}:
    get:
      operationId: getMediaUpload
      tags: [midia]
      summary: Situação do processamento de um envio próprio (consulta curta enquanto o envio está ativo).
      security: [{ accountSession: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Situação.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MediaUpload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/public/media/{assetId}/{size}:
    get:
      operationId: getPublicMedia
      tags: [midia, publico]
      summary: Variante pública (logo ou foto profissional publicada). URL versionada pelo id; cache de 5 min.
      security: []
      x-authz: [{ actor: public, scope: none }]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ImageSize'
      responses:
        '200': { $ref: '#/components/responses/PublicImage' }
        '304': { description: Não modificada. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/public/config:
    get:
      operationId: getPublicConfig
      tags: [publico]
      summary: O que está ligado (Google, fotos) e a origem pública canônica (links e QR Code). Sem segredos.
      security: []
      x-authz: [{ actor: public, scope: none }]
      responses:
        '200':
          description: Configuração pública.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicConfig' }
        default: { $ref: '#/components/responses/Unexpected' }

  # ---------------------------------------------------------------- visitante
  /v1/establishments/{establishmentId}/visitor-sessions:
    post:
      operationId: createVisitorSession
      tags: [visitante]
      summary: Cria credencial de visitante nesta loja e devolve o código de recuperação uma única vez.
      description: |
        Não é idempotente por chave: repetir cria outra identidade sem visita (a anterior expira).
        Se o navegador já tem visitante desta loja com visita ativa ou comanda pendente, responde 409.
      security: [{}, { visitorSession: [] }]
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-VS-01]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVisitorSessionRequest' }
      responses:
        '201':
          description: Visitante criado. Set-Cookie com __Host-fila_visitor.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetVisitorCookie' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/VisitorSessionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/establishments/{establishmentId}/visitor-sessions/recover:
    post:
      operationId: recoverVisitorSession
      tags: [visitante]
      summary: Recupera a visita com o código; troca o código e revoga credenciais anteriores.
      security: [{}, { visitorSession: [] }]
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-VS-02]
      x-events: [stream.session_ended]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoverVisitorSessionRequest' }
      responses:
        '200':
          description: Visita recuperada; novo código devolvido uma única vez.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetVisitorCookie' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/VisitorSessionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/visitor-sessions/current/end:
    post:
      operationId: endVisitorSession
      tags: [visitante]
      summary: Encerra a credencial de visitante deste navegador (não cancela a visita).
      security: [{ visitorSession: [], csrfToken: [] }]
      x-authz: [{ actor: visitor, scope: self }]
      x-transitions: [T-VS-03]
      x-events: [stream.session_ended]
      responses:
        '204': { description: Credencial revogada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unexpected' }

  # ---------------------------------------------------------------- público
  /v1/public/establishments:
    get:
      operationId: listPublicEstablishments
      tags: [publico]
      summary: Diretório de barbearias (busca, ordem por distância ou abertas agora, paginado).
      description: |
        Só dados públicos da loja e o resumo das filas abertas. `sort`: `distance` (mais perto primeiro,
        lojas sem localização no fim; exige `lat` e `lng`), `open` (com fila aberta primeiro, depois nome;
        padrão sem localização) ou `name` (A–Z). Sem `sort`, usa `distance` quando há `lat`/`lng`.
        A localização do cliente vai só nesta consulta: não é gravada nem registrada em log.
        Distância em linha reta (não é rota). Busca sem diferenciar acentos/maiúsculas no nome e no endereço.
        O cursor vale só para a mesma busca (outra busca/ordem → 400).
      security: []
      x-authz: [{ actor: public, scope: none }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 80 }, description: Nome ou endereço. }
        - { name: lat, in: query, required: false, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: false, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [distance, open, name] } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Uma página de barbearias.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DirectoryEstablishment' }
                  page: { $ref: '#/components/schemas/PageInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/my-visits:
    get:
      operationId: listMyVisits
      tags: [cliente]
      summary: Painel do cliente — visitas em andamento em todas as lojas (conta e visitantes deste navegador).
      description: |
        Mesmo critério de `getCurrentVisit`, loja por loja: participação ativa, comanda ainda não encerrada
        ou (visitante) encerrada há menos de 24 h. Ordem: chamado, em atendimento, aguardando, depois o resto.
        Conta: até as 20 lojas mais recentes. Sem conta e sem visitante → 401.
      security: [{ visitorSession: [] }, { accountSession: [] }]
      x-authz: [{ actor: visitor, scope: self }, { actor: customer, scope: self }]
      responses:
        '200':
          description: Visitas em andamento (pode ser vazia).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MyVisit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/public/slugs/{slug}:
    get:
      operationId: getPublicEstablishmentBySlug
      tags: [publico]
      summary: Dados públicos da loja a partir do link/QR.
      description: |
        Aceita também endereços antigos da loja (trocados junto com o nome). A resposta traz sempre o
        `slug` atual; quando difere do pedido, a tela leva o navegador ao endereço atual.
      security: []
      x-authz: [{ actor: public, scope: none }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Loja.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicEstablishment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/public/establishments/{establishmentId}/services:
    get:
      operationId: listPublicServices
      tags: [publico]
      summary: Catálogo ativo (sem dados privados).
      security: []
      x-authz: [{ actor: public, scope: none }]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: Serviços ativos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicService' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/public/establishments/{establishmentId}/queues:
    get:
      operationId: listPublicQueues
      tags: [publico]
      summary: Filas públicas (senhas, quantidade, estimativa). Nunca nick, serviços ou valores.
      security: []
      x-authz: [{ actor: public, scope: none }]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: Filas.
          content:
            application/json:
              schema:
                type: object
                required: [data, cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicQueue' }
                  cursor: { $ref: '#/components/schemas/SnapshotCursor' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }

  # ---------------------------------------------------------------- visita (cliente/visitante)
  /v1/establishments/{establishmentId}/my-visit:
    get:
      operationId: getCurrentVisit
      tags: [cliente]
      summary: Visita atual (participação + comanda + pagamento) da identidade em uso nesta loja.
      description: Inclui visita encerrada há menos de 24 h para visitante. `data` é nulo sem visita.
      security: [{ visitorSession: [] }, { accountSession: [] }]
      x-authz: [{ actor: visitor, scope: visit_owner }, { actor: customer, scope: visit_owner }]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: Visita ou nulo.
          content:
            application/json:
              schema:
                type: object
                required: [data, cursor]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/Visit'
                      - type: 'null'
                  cursor: { $ref: '#/components/schemas/SnapshotCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/establishments/{establishmentId}/participations:
    post:
      operationId: createParticipation
      tags: [fila]
      summary: Entra na fila de um profissional com ≥1 serviço; preço calculado no servidor.
      security: [{ visitorSession: [], csrfToken: [] }, { accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: visitor, scope: self }, { actor: customer, scope: self }]
      x-transitions: [T-P-01, T-O-01]
      x-events: [participation.updated, order.updated, queue.public.updated, queue.updated]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateParticipationRequest' }
      responses:
        '201':
          description: Entrada confirmada pelo servidor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Visit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/establishments/{establishmentId}/participations/{participationId}/customer-avatar/{size}:
    get:
      operationId: getCustomerAvatar
      tags: [midia, fila]
      summary: Foto pessoal do cliente com conta, para a equipe da fila, SÓ enquanto a participação está ativa.
      description: |
        Dono da loja ou o profissional da fila. Participação encerrada, visitante ou outra loja → 404.
        A autorização é refeita a cada pedido (inclusive antes do 304); nunca vai para cache compartilhado.
      security: [{ accountSession: [] }]
      x-authz: [{ actor: professional, scope: own_queue }, { actor: owner, scope: establishment }]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - $ref: '#/components/parameters/ParticipationId'
        - $ref: '#/components/parameters/ImageSize'
      responses:
        '200': { $ref: '#/components/responses/PrivateImage' }
        '304': { description: Não modificada (depois de autorizar). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/establishments/{establishmentId}/participations/{participationId}:
    get:
      operationId: getParticipation
      tags: [fila]
      summary: Participação (dono da visita ou equipe autorizada).
      security: [{ visitorSession: [] }, { accountSession: [] }]
      x-authz:
        - { actor: visitor, scope: visit_owner }
        - { actor: customer, scope: visit_owner }
        - { actor: professional, scope: own_queue }
        - { actor: owner, scope: establishment }
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - $ref: '#/components/parameters/ParticipationId'
      responses:
        '200':
          description: Participação.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Participation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/establishments/{establishmentId}/participations/{participationId}/cancel:
    post:
      operationId: cancelParticipation
      tags: [fila]
      summary: Desistência (dono da visita) ou cancelamento com motivo (dono da loja). Só aguardando/chamado.
      security: [{ visitorSession: [], csrfToken: [] }, { accountSession: [], csrfToken: [] }]
      x-authz:
        - { actor: visitor, scope: visit_owner }
        - { actor: customer, scope: visit_owner }
        - { actor: owner, scope: establishment }
      x-transitions: [T-P-04, T-P-05, T-O-05, T-CR-04]
      x-events: [participation.updated, order.updated, payment.updated, change_request.updated, queue.public.updated, queue.updated]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - $ref: '#/components/parameters/ParticipationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/VisitOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/establishments/{establishmentId}/participations/{participationId}/start:
    post:
      operationId: startService
      tags: [fila]
      summary: Chamado → em atendimento (permitido com fila pausada ou fechada).
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: professional, scope: own_queue }, { actor: owner, scope: establishment }]
      x-transitions: [T-P-03]
      x-events: [participation.updated, queue.public.updated, queue.updated]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - $ref: '#/components/parameters/ParticipationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedRequest' }
      responses:
        '200': { $ref: '#/components/responses/VisitOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/establishments/{establishmentId}/participations/{participationId}/no-show:
    post:
      operationId: markNoShow
      tags: [fila]
      summary: Chamado → ausente, somente após 10 minutos da chamada (relógio do servidor).
