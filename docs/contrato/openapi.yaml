      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      x-reauth: true
      x-transitions: [T-AC-03, T-P-10, T-O-05, T-RW-06, T-LG-03]
      x-events: [stream.session_ended, participation.updated, order.updated, payment.updated, change_request.updated, queue.public.updated, queue.updated, reward_reservation.updated, deletion_request.updated, pendencies.updated]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestDeletionRequest' }
      responses:
        '202':
          description: Solicitação registrada.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DeletionRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
