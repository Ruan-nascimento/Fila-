openapi: 3.1.0
info:
  title: Fila — API do MVP web
  version: 0.1.0
  summary: Contrato único entre backend (Go) e frontend (React/TypeScript).
  description: |
    Contrato da etapa 00. Regras em docs/regras.md, convenções em docs/contrato/convencoes.md,
    eventos em docs/contrato/eventos-sse.md e transições em docs/matriz-transicoes.md.

    Extensões próprias:
    - `x-authz`: lista de pares ator/escopo autorizados. Qualquer combinação fora da lista é negada (negação por padrão).
    - `x-transitions`: transições da matriz (T-…) que a operação pode executar.
    - `x-events`: tipos de evento SSE gravados na outbox quando a operação muda estado.
    - `x-reauth`: exige reautenticação recente (10 minutos).
    - `x-external-pending`: detalhe que depende de documentação/conta do provedor (etapas 08/09).

    Regras gerais: valores em centavos inteiros (BRL); datas RFC 3339 em UTC com sufixo Z;
    identificadores opacos; corpo desconhecido é rejeitado (`additionalProperties: false`);
    todo comando mutável fora de /v1/auth, /v1/visitor-sessions e /v1/webhooks exige `Idempotency-Key`.
  license:
    name: Proprietário
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Mesma origem do frontend (proxy reverso). Ver ADR-0006.
tags:
  - name: saude
    description: Liveness e readiness.
  - name: sessao
    description: Conta, login, sessões, senha e convites.
  - name: visitante
    description: Credencial de visitante e código de recuperação.
  - name: publico
    description: Dados públicos da loja, catálogo e filas.
  - name: cliente
    description: Visita atual, perfil e histórico do titular.
  - name: fila
    description: Participação na fila e operação pela equipe.
  - name: comanda
    description: Itens, solicitações, conclusão e interrupção.
  - name: pagamento
    description: Pix, recebimentos, conferência, estornos e pendências financeiras.
  - name: fidelidade
    description: Programa, pontos, prêmios e reservas.
  - name: administracao
    description: Configuração da loja, equipe, catálogo e auditoria.
  - name: exclusao
    description: Exclusão de conta e acompanhamento.
  - name: eventos
    description: Fluxo SSE de atualizações.
  - name: provedor
    description: Notificações do provedor de pagamento.

paths:
  /healthz/live:
    get:
      operationId: getLiveness
      tags: [saude]
      summary: Processo vivo (não consulta dependências).
      security: []
      x-authz: [{ actor: public, scope: none }]
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /healthz/ready:
    get:
      operationId: getReadiness
      tags: [saude]
      summary: Pronto para tráfego (banco acessível e migrações aplicadas).
      security: []
      x-authz: [{ actor: public, scope: none }]
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- sessão e conta
  /v1/session:
    get:
      operationId: getSession
      tags: [sessao]
      summary: Identidades ativas neste navegador e token CSRF.
      description: Nunca falha por falta de sessão; devolve campos nulos. Renova o uso (expiração por inatividade).
      security: [{}, { accountSession: [] }, { visitorSession: [] }]
      x-authz: [{ actor: public, scope: none }]
      responses:
        '200':
          description: Sessão atual.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SessionView' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/register:
    post:
      operationId: registerAccount
      tags: [sessao]
      summary: Cadastro de cliente. Resposta idêntica exista ou não o e-mail.
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-AC-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAccountRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedGeneric' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/email-verification/confirm:
    post:
      operationId: verifyEmail
      tags: [sessao]
      summary: Confirma e-mail com token de uso único.
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-AC-02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204': { description: E-mail verificado; conta ativa. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/email-verification/resend:
    post:
      operationId: resendVerification
      tags: [sessao]
      summary: Reenvia verificação. Resposta genérica.
      security: []
      x-authz: [{ actor: public, scope: none }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedGeneric' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/login:
    post:
      operationId: login
      tags: [sessao]
      summary: Cria sessão de cliente ou de equipe e define cookie HttpOnly.
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-SS-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sessão criada. Cabeçalho Set-Cookie com __Host-fila_session.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SessionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [sessao]
      summary: Revoga a sessão de conta no servidor e apaga o cookie.
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      x-transitions: [T-SS-02]
      x-events: [stream.session_ended]
      responses:
        '204': { description: Sessão revogada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [sessao]
      summary: Solicita link de redefinição (30 min, uso único). Resposta genérica.
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-PW-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedGeneric' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [sessao]
      summary: Define nova senha com token; revoga todas as sessões da conta.
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-PW-02, T-SS-04]
      x-events: [stream.session_ended]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: Senha alterada; sessões revogadas. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/password/change:
    post:
      operationId: changePassword
      tags: [sessao]
      summary: Troca a senha; revoga as demais sessões.
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      x-transitions: [T-SS-03]
      x-events: [stream.session_ended]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Senha alterada. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/reauthenticate:
    post:
      operationId: reauthenticate
      tags: [sessao]
      summary: Confirma identidade recente (válida por 10 min) para ações sensíveis.
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      x-transitions: [T-SS-06]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReauthenticateRequest' }
      responses:
        '200':
          description: Reautenticado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SessionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/auth/invites/accept:
    post:
      operationId: acceptInvite
      tags: [sessao]
      summary: Profissional ativa acesso pelo convite (uso único, 24 h).
      description: Se o e-mail já possui conta ativa, exige `password` dessa conta; caso contrário cria conta já verificada (o convite prova o e-mail).
      security: []
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-IN-02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '204': { description: Vínculo ativo. Fazer login com contexto staff. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/me:
    patch:
      operationId: updateMyProfile
      tags: [cliente]
      summary: Altera o nome exibido da própria conta.
      security: [{ accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: customer, scope: self }, { actor: professional, scope: self }, { actor: owner, scope: self }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AccountView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }
        default: { $ref: '#/components/responses/Unexpected' }

  # ---------------------------------------------------------------- visitante
  /v1/establishments/{establishmentId}/visitor-sessions:
    post:
      operationId: createVisitorSession
      tags: [visitante]
      summary: Cria credencial de visitante nesta loja e devolve o código de recuperação uma única vez.
      description: |
        Não é idempotente por chave: repetir cria outra identidade sem visita (a anterior expira).
        Se o navegador já tem visitante desta loja com visita ativa ou comanda pendente, responde 409.
      security: [{}, { visitorSession: [] }]
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-VS-01]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVisitorSessionRequest' }
      responses:
        '201':
          description: Visitante criado. Set-Cookie com __Host-fila_visitor.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetVisitorCookie' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/VisitorSessionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/establishments/{establishmentId}/visitor-sessions/recover:
    post:
      operationId: recoverVisitorSession
      tags: [visitante]
      summary: Recupera a visita com o código; troca o código e revoga credenciais anteriores.
      security: [{}, { visitorSession: [] }]
      x-authz: [{ actor: public, scope: none }]
      x-transitions: [T-VS-02]
      x-events: [stream.session_ended]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoverVisitorSessionRequest' }
      responses:
        '200':
          description: Visita recuperada; novo código devolvido uma única vez.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetVisitorCookie' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/VisitorSessionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/visitor-sessions/current/end:
    post:
      operationId: endVisitorSession
      tags: [visitante]
      summary: Encerra a credencial de visitante deste navegador (não cancela a visita).
      security: [{ visitorSession: [], csrfToken: [] }]
      x-authz: [{ actor: visitor, scope: self }]
      x-transitions: [T-VS-03]
      x-events: [stream.session_ended]
      responses:
        '204': { description: Credencial revogada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unexpected' }

  # ---------------------------------------------------------------- público
  /v1/public/slugs/{slug}:
    get:
      operationId: getPublicEstablishmentBySlug
      tags: [publico]
      summary: Dados públicos da loja a partir do link/QR.
      security: []
      x-authz: [{ actor: public, scope: none }]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Loja.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicEstablishment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/public/establishments/{establishmentId}/services:
    get:
      operationId: listPublicServices
      tags: [publico]
      summary: Catálogo ativo (sem dados privados).
      security: []
      x-authz: [{ actor: public, scope: none }]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: Serviços ativos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicService' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/public/establishments/{establishmentId}/queues:
    get:
      operationId: listPublicQueues
      tags: [publico]
      summary: Filas públicas (senhas, quantidade, estimativa). Nunca nick, serviços ou valores.
      security: []
      x-authz: [{ actor: public, scope: none }]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: Filas.
          content:
            application/json:
              schema:
                type: object
                required: [data, cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicQueue' }
                  cursor: { $ref: '#/components/schemas/StreamCursor' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }

  # ---------------------------------------------------------------- visita (cliente/visitante)
  /v1/establishments/{establishmentId}/my-visit:
    get:
      operationId: getCurrentVisit
      tags: [cliente]
      summary: Visita atual (participação + comanda + pagamento) da identidade em uso nesta loja.
      description: Inclui visita encerrada há menos de 24 h para visitante. `data` é nulo sem visita.
      security: [{ visitorSession: [] }, { accountSession: [] }]
      x-authz: [{ actor: visitor, scope: visit_owner }, { actor: customer, scope: visit_owner }]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: Visita ou nulo.
          content:
            application/json:
              schema:
                type: object
                required: [data, cursor]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/Visit'
                      - type: 'null'
                  cursor: { $ref: '#/components/schemas/StreamCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/establishments/{establishmentId}/participations:
    post:
      operationId: createParticipation
      tags: [fila]
      summary: Entra na fila de um profissional com ≥1 serviço; preço calculado no servidor.
      security: [{ visitorSession: [], csrfToken: [] }, { accountSession: [], csrfToken: [] }]
      x-authz: [{ actor: visitor, scope: self }, { actor: customer, scope: self }]
      x-transitions: [T-P-01, T-O-01]
      x-events: [participation.updated, order.updated, queue.public.updated, queue.updated]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateParticipationRequest' }
      responses:
        '201':
          description: Entrada confirmada pelo servidor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Visit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/establishments/{establishmentId}/participations/{participationId}:
    get:
      operationId: getParticipation
      tags: [fila]
      summary: Participação (dono da visita ou equipe autorizada).
      security: [{ visitorSession: [] }, { accountSession: [] }]
      x-authz:
        - { actor: visitor, scope: visit_owner }
        - { actor: customer, scope: visit_owner }
        - { actor: professional, scope: own_queue }
        - { actor: owner, scope: establishment }
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - $ref: '#/components/parameters/ParticipationId'
      responses:
        '200':
          description: Participação.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Participation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Unexpected' }
  /v1/establishments/{establishmentId}/participations/{participationId}/cancel:
    post:
      operationId: cancelParticipation
      tags: [fila]
      summary: Desistência (dono da visita) ou cancelamento com motivo (dono da loja). Só aguardando/chamado.
      security: [{ visitorSession: [], csrfToken: [] }, { accountSession: [], csrfToken: [] }]
      x-authz:
        - { actor: visitor, scope: visit_owner }
        - { actor: customer, scope: visit_owner }
        - { actor: owner, scope: establishment }
      x-transitions: [T-P-04, T-P-05, T-O-05, T-CR-04]
      x-events: [participation.updated, order.updated, queue.public.updated, queue.updated]
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - $ref: '#/components/parameters/ParticipationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedReasonRequest' }
