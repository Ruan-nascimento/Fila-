[package]
name = "fila-gestao"
version = "1.1.0"
description = "Fila Gestão: programa do dono da barbearia (abre a gestão do site)"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "fila_gestao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
url = "2"

[dependencies]
# tray-icon: ícone na bandeja para o segundo plano (ADR-0037).
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.2"
# Notificações nativas do sistema para a gestão (troca window.Notification da página pela do
# sistema). A página remota só recebe as 3 permissões de notificação (capability em lib.rs).
tauri-plugin-notification = "=2.8.1"
# Uma instância só: abrir de novo traz a janela existente (sem duas fontes de avisos duplicados).
tauri-plugin-single-instance = "=2.5.5"
# Mensagem nativa da primeira ativação do segundo plano (chamada só pelo lado nativo).
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
# Só para conferir se o painel responde antes de abri-lo (TLS com raízes embutidas, sem OpenSSL).
ureq = "=3.5.1"
serde_json = "1"
# Chave da instalação e prova DPoP (RFC 9449): ES256 da RustCrypto (bibliotecas mantidas).
p256 = { version = "0.13", features = ["ecdsa", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
httpdate = "1"
uuid = { version = "1", features = ["serde"] }
url = "2"

# Chave privada no cofre do sistema: Gerenciador de Credenciais (Windows) e Secret Service
# (GNOME Keyring/KWallet, Linux). Nunca em arquivo comum nem no JavaScript.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
