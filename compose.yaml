# PostgreSQL local para desenvolvimento (requer Docker Desktop ou Docker Engine).
#   Subir:   docker compose up -d --wait
#   Parar:   docker compose stop
#   Apagar TODOS os dados locais:  docker compose down -v
# A senha vem do arquivo .env (copie de .env.example). A porta só aceita conexões deste computador.
name: fila

services:
  postgres:
    # Imagem oficial fixada por versão e digest. Atualizações chegam por Dependabot.
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fila}
      POSTGRES_USER: ${POSTGRES_USER:-fila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (copie de .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # A partir do PostgreSQL 18 a imagem oficial guarda os dados em subpastas de /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
