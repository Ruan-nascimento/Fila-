# Propostas automáticas de atualização de dependências (revisar e aprovar manualmente).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ferramentas-de-desenvolvimento:
        dependency-type: development
    ignore:
      # openapi-typescript 7.x exige typescript ^5: o 7 quebra o npm install.
      # Retirar quando o openapi-typescript aceitar o TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /docs/tools
    schedule:
      interval: monthly
