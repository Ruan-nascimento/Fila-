# Gera os instaladores do Fila Gestão (desktop-dono/) sob demanda: Windows (NSIS .exe) e
# Linux Mint/Ubuntu (.deb). Não roda em push: Actions → "Fila Gestão (instaladores)" → Run workflow,
# informando a URL HTTPS real do painel. Os arquivos ficam em "Artifacts" da execução.
# Ações fixadas por SHA de commit (o comentário mostra a versão).
name: Fila Gestão (instaladores)

on:
  workflow_dispatch:
    inputs:
      painel_url:
        description: "Origem HTTPS do painel (ex.: https://fila.suabarbearia.com.br)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop-dono
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # O Dashboard reaproveita estilos e componentes de frontend/src (e as dependências deles).
      - run: npm ci --prefix ../frontend
      - run: npm ci
      - run: npm run build:windows
        env:
          FILA_PAINEL_URL: ${{ inputs.painel_url }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fila-gestao-windows
          path: desktop-dono/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Pacote Linux (.deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop-dono
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev build-essential
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # O Dashboard reaproveita estilos e componentes de frontend/src (e as dependências deles).
      - run: npm ci --prefix ../frontend
      - run: npm ci
      - run: npm run build:linux
        env:
          FILA_PAINEL_URL: ${{ inputs.painel_url }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fila-gestao-linux
          path: desktop-dono/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
