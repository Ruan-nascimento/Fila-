# Gera os instaladores do Fila Gestão (desktop-dono/) sob demanda: Windows (NSIS .exe) e
# Linux Mint/Ubuntu (.deb). Não roda em push: Actions → "Fila Gestão (instaladores)" → Run workflow,
# informando a URL HTTPS real do painel. Os arquivos ficam em "Artifacts" da execução.
# Ações fixadas por SHA de commit (o comentário mostra a versão).
name: Fila Gestão (instaladores)

on:
  workflow_dispatch:
    inputs:
      painel_url:
        description: "Origem HTTPS do painel (ex.: https://fila.suabarbearia.com.br)"
        required: true
        type: string
      rascunho_release:
        description: "Criar RASCUNHO de Release (não público) com instaladores, checksums e notas"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop-dono
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # O Dashboard reaproveita estilos e componentes de frontend/src (e as dependências deles).
      - run: npm ci --prefix ../frontend
      - run: npm ci
      - run: npm run test:ui
      - run: npm run build:windows
        env:
          FILA_PAINEL_URL: ${{ inputs.painel_url }}
      - name: Checksum SHA-256
        shell: bash
        run: cd src-tauri/target/release/bundle/nsis && sha256sum *.exe > SHA256SUMS-windows.txt && cat SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fila-gestao-windows
          path: |
            desktop-dono/src-tauri/target/release/bundle/nsis/*.exe
            desktop-dono/src-tauri/target/release/bundle/nsis/SHA256SUMS-windows.txt
          if-no-files-found: error

  linux:
    name: Pacote Linux (.deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop-dono
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev build-essential
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # O Dashboard reaproveita estilos e componentes de frontend/src (e as dependências deles).
      - run: npm ci --prefix ../frontend
      - run: npm ci
      - run: npm run test:ui
      - run: npm run build:linux
        env:
          FILA_PAINEL_URL: ${{ inputs.painel_url }}
      - name: Checksum SHA-256
        run: cd src-tauri/target/release/bundle/deb && sha256sum *.deb > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fila-gestao-linux
          path: |
            desktop-dono/src-tauri/target/release/bundle/deb/*.deb
            desktop-dono/src-tauri/target/release/bundle/deb/SHA256SUMS-linux.txt
          if-no-files-found: error

  rascunho:
    name: Rascunho de Release
    if: ${{ inputs.rascunho_release }}
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Criar rascunho (não publicado)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="$(node -p "require('./desktop-dono/package.json').version")"
          # O GitHub troca espaços e acentos nos nomes dos anexos; com nomes ASCII definidos aqui,
          # o SHA256SUMS lista exatamente os arquivos que quem baixa recebe (sha256sum -c funciona).
          mkdir rel
          cp dist/*.exe "rel/Fila-Gestao_${v}_x64-setup.exe"
          cp dist/*.deb "rel/Fila-Gestao_${v}_amd64.deb"
          (cd rel && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Confere com as somas geradas em cada build (o arquivo copiado é o mesmo que foi construído).
          for h in $(cut -d' ' -f1 rel/SHA256SUMS.txt); do grep -q "$h" dist/SHA256SUMS-*.txt; done
          gh release create "desktop-v$v" --draft --target "$GITHUB_SHA" \
            --title "Fila Gestão $v" --notes-file desktop-dono/NOTAS-DA-VERSAO.md rel/*
