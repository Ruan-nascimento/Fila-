# Integração contínua: formatação, análise estática, testes, build, dependências e segredos.
# Ações fixadas por SHA de commit (o comentário mostra a versão); o Dependabot propõe atualizações.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrato:
    name: Contrato e rastreabilidade
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Instalar dependências do verificador
        run: python -m pip install --require-hashes --no-deps -r docs/tools/requirements.txt
      - name: Regras, matriz, cenários e contrato coerentes
        run: python docs/tools/verificar_contrato.py
      - name: Rastreabilidade regra → cenário → teste em dia
        run: python docs/tools/rastrear_evidencias.py --verificar
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Lint do OpenAPI (Redocly, versão fixada)
        working-directory: docs/contrato
        run: npx --yes @redocly/cli@2.72.0 lint openapi.yaml

  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
        env:
          POSTGRES_USER: fila_ci
          POSTGRES_PASSWORD: somente-ci-descartavel
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fila_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Banco descartável criado só para este job; não é segredo de nenhum ambiente real.
      FILA_TEST_DATABASE_URL: postgres://fila_ci:somente-ci-descartavel@localhost:5432/postgres?sslmode=disable
      FILA_REQUIRE_DB_TESTS: "1"
      # Menor privilégio (etapa 12): os testes de integração conectam com um papel que só lê e
      # escreve dados, como a aplicação em produção (testdb aplica database.ApplyGrants).
      FILA_TEST_APP_ROLE: fila_app_ci
      FILA_TEST_APP_PASSWORD: somente-ci-descartavel-app
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formatação (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Arquivos fora do padrão gofmt:"; echo "$unformatted"; exit 1; fi
      - name: Módulos íntegros e go.mod/go.sum em dia
        run: |
          go mod verify
          go mod tidy -diff
      - name: Tipos gerados do contrato em dia
        run: |
          go generate ./internal/contrato
          git diff --exit-code -- internal/contrato
      - name: Análise estática (go vet)
        run: go vet ./...
      - name: Análise estática (staticcheck)
        run: go tool staticcheck ./...
      - name: Vulnerabilidades conhecidas (govulncheck)
        run: go tool govulncheck ./...
      - name: Papel restrito da aplicação no PostgreSQL de CI
        working-directory: .
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U fila_ci -d postgres
          -c "CREATE ROLE fila_app_ci LOGIN PASSWORD 'somente-ci-descartavel-app'"
      - name: Executáveis de produção sem código de teste (simulador de Pix, banco de teste)
        run: |
          if go list -deps ./cmd/api ./cmd/worker ./cmd/fila-admin ./cmd/migrate | grep -E 'pagamentotest|platform/testdb'; then
            echo "Um executável de produção depende de pacote de teste." ; exit 1
          fi
      - name: Testes com PostgreSQL real e detector de corridas
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      - name: Resumir falhas dos testes (anotações legíveis sem login)
        if: failure()
        run: |
          grep -E -- '--- FAIL|WARNING: DATA RACE|^panic:|_test\.go:[0-9]+:' "$RUNNER_TEMP/go-test.log" | head -n 30 |
            sed -e 's/%/%25/g' -e 's/^/::error title=go test::/' || true
      - name: Build dos executáveis
        run: go build -trimpath -o ../bin/ ./cmd/...

  frontend:
    name: Frontend (React + TypeScript + Vite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências exatamente como no lockfile
        run: npm ci --no-fund
      - name: Vulnerabilidades conhecidas (npm audit)
        run: npm audit --audit-level=moderate
      - name: Tipos gerados do contrato em dia
        run: npm run check:api
      - name: Formatação (Prettier)
        run: npm run format:check
      - name: Análise estática (ESLint)
        run: npm run lint
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Testes (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Nenhuma variável de configuração nem dado do provedor no bundle público
        run: |
          if grep -rIE "FILA_|POSTGRES_|DATABASE_URL" dist; then
            echo "O bundle contém nomes de configuração do servidor; verifique o código." ; exit 1
          fi
          # Chave da AbacatePay (teste/produção), secret e chave de assinatura do webhook: só no backend.
          if grep -rIiE "abc_(dev|prod)_|webhook_?secret|x-webhook-signature|abacatepay\.com|t9dXRhHHo3" dist; then
            echo "O bundle contém dado do provedor de pagamento; ele só pode existir no backend." ; exit 1
          fi

  implantacao:
    name: Implantação (imagens, compose, scripts, alertas)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scripts de implantação e backup (shellcheck)
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          --severity=info deploy/implantar.sh deploy/restaurar.sh deploy/backup/backup.sh
          deploy/backup/restaurar-banco.sh deploy/postgres/init/01-papeis.sh deploy/caddy/publicar-site.sh
      - name: Compose válido para homologação e produção
        run: |
          docker compose version
          for amb in producao homologacao; do
            cp "deploy/env/aplicacao-$amb.env.example" "$RUNNER_TEMP/app-$amb.env"
            sed "s#^FILA_CONFIG=.*#FILA_CONFIG=$RUNNER_TEMP/app-$amb.env#" "deploy/env/$amb.env.example" > "$RUNNER_TEMP/$amb.env"
            docker compose -f deploy/compose.yaml --env-file "$RUNNER_TEMP/$amb.env"               --profile ferramentas --profile banco-local --profile monitoramento config --quiet
          done
      - name: Regras de alerta válidas (promtool)
        run: >-
          docker run --rm -v "$PWD/deploy/monitoramento:/etc/prometheus:ro" --entrypoint promtool
          prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          check config /etc/prometheus/prometheus.yml
      - name: Imagens do backend e do site
        run: |
          docker build -f deploy/Dockerfile.backend --build-arg VERSAO="$GITHUB_SHA" -t fila-backend:ci .
          docker build -f deploy/Dockerfile.web -t fila-web:ci .
      - name: Imagem do site sem dado do servidor nem do provedor
        run: |
          id=$(docker create fila-web:ci)
          docker cp "$id:/srv" "$RUNNER_TEMP/srv"
          docker rm "$id"
          if grep -rIiE "FILA_|POSTGRES_|DATABASE_URL|abc_(dev|prod)_|webhook_?secret|t9dXRhHHo3" "$RUNNER_TEMP/srv"; then
            echo "O site publicado contém configuração do servidor ou dado do provedor." ; exit 1
          fi
      - name: Imagem do backend recusa produção com Pix simulado
        run: |
          set +e
          out=$(docker run --rm -e FILA_ENV=production -e FILA_DATABASE_URL="postgres://u:segredo-real-1@db:5432/fila?sslmode=require"             -e FILA_ALLOWED_ORIGINS=https://f.exemplo.com -e FILA_PUBLIC_BASE_URL=https://f.exemplo.com             -e FILA_SECRET_KEY=$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')             -e FILA_PIX_PROVIDER=abacatepay -e FILA_ABACATEPAY_API_KEY=abc_dev_qualquer             -e FILA_ABACATEPAY_BASE_URL=https://simulador.interno/v2 fila-backend:ci 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" = "2" ] && echo "$out" | grep -q "chave de teste" && echo "$out" | grep -q "endereço oficial"

  segredos:
    name: Segredos versionados (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Varredura do histórico completo
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
